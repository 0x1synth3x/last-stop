<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Last Stop</title>

    <link rel="stylesheet" href="./styles.css?v=3">
</head>

<body>
    <main>
        <p class="label">
            NIGHT SHIFT · INCIDENT NOTE
            <span id="page">01</span>
        </p>

        <img src="./stop.svg" alt="A dim bus shelter on a wet street">

        <p class="time">02:58 AM · LAST BUS</p>

        <h1 id="title">The ride home</h1>

        <p id="story">
            Last winter, I closed the pharmacy on Grant Street and missed
            the 2:58. The stop was empty. Then a man came out of the dark
            end of the car park.
        </p>

        <p class="pockets">
            PHONE: 4% · NAME BADGE: STILL ON
        </p>

        <div id="choices"></div>

        <button id="again" hidden>
            Try another night
        </button>

        <footer>
            DON'T TAKE THE SHORT WAY HOME
        </footer>
    </main>

    <script src="./script.js?v=3"></script>
</body>
</html>
