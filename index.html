<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Last Stop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <p class="label">NIGHT BUS RADIO · ROUTE 09</p>
    <img src="stop.svg" alt="An empty bus stop at night">
    <p class="time">02:58 AM · NO SERVICE</p>
    <p class="label">FIELD NOTES <span id="page">01</span></p>
    <h1 id="title">The last stop</h1>
    <p id="story">Your bus is late. A paper cup rolls past your shoe, but there isn't any wind.</p>
    <p class="pockets">POCKETS: one dead phone, one bus ticket</p>
    <div id="choices"></div>
    <button id="again" hidden>Try another night</button>
    <footer>MADE FOR THE HOURS THAT FEEL A LITTLE WRONG</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
